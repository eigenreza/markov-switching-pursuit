  mabe22:
    status: conspecific
    title: MABe22 mouse triplets (pose and frame-level labels)
    doi: 10.22002/rdsa8-rde65
    record: https://data.caltech.edu/records/rdsa8-rde65
    licence: CC-BY-NC-SA (stated in the dataset paper's datasheet; the record page carries no licence field)
    species: mouse pursuing mouse (three adult males, C57BL/6J or BTBR)
    keypoints: [nose, left_ear, right_ear, neck, body_centroid, tail_base, tail_middle, tail_tip, left_fore_paw, right_fore_paw, left_hind_paw, right_hind_paw]
    arena_cm: [52.0, 52.0]
    native_fps: 30
    analysis_fps: 30
    sequence_frames: 1800
