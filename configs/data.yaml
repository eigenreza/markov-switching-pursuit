# Provisional segmentation thresholds used in the audit. They are frozen only after the
# development-set work; the frozen values are given in docs/data.md.
segmentation_provisional:
  min_pursuer_speed_cm_s: 10.0
  min_closing_speed_cm_s: 5.0
  max_bearing_deg: 60.0
  min_start_range_cm: 8.0
  contact_range_cm: 3.0
  stall_window_s: 0.5
  min_duration_s: 0.5
